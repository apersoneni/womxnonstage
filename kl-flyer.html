<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap');

    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (Math.random() * 0.45 + 0.1).toFixed(2);
    const sz = (Math.random() * 2 + 0.6).toFixed(1) + 'px';
    s.style.width = s.style.height = sz;
    stars.appendChild(s);
  }

  function scaleFlyer() {
    const scaler = document.getElementById('scaler');
    const scale = Math.min(window.innerWidth / 580, window.innerHeight / 840, 1);
    scaler.style.transform = 'scale(' + scale + ')';
  }
  scaleFlyer();
  window.addEventListener('resize', scaleFlyer);
</script>
